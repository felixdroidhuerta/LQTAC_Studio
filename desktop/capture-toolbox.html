<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>LQTAC · Captura</title>
<style>
:root{color-scheme:dark;--ink:#061329;--panel:#0d2343;--line:rgba(176,204,255,.14);--text:#f7fbff;--muted:#8ea3c4;--blue:#6ea2ff;--cyan:#79e5f5;--green:#b9f28c;--red:#ff8597}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--ink);color:var(--text);font:12px Inter,ui-sans-serif,system-ui,'Segoe UI',sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-app-region:no-drag}button:disabled,input:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}button{transition:background .15s,border-color .15s}button:hover:not(:disabled){filter:brightness(1.13)}
.shell{min-height:100vh;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 100% 0,rgba(64,126,214,.16),transparent 50%),var(--ink)}
.header{height:60px;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none}.brand-icon{width:31px;height:31px;border-radius:8px}.brand{flex:1}.brand strong{display:block;font-size:13px;letter-spacing:.08em}.brand small{color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase}.header button{display:flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035);font-size:11px;color:var(--muted)}
main{padding:14px 16px 10px;display:grid;gap:12px}.timer-panel{padding:14px 14px 12px;border:1px solid var(--line);background:linear-gradient(125deg,rgba(29,61,101,.55),rgba(12,31,57,.65));border-radius:13px}.timer-top{display:flex;align-items:center;justify-content:space-between}.state{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:9px;letter-spacing:.14em;font-weight:650}.state-dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 10px rgba(185,242,140,.25)}body[data-state=recording] .state-dot{background:var(--red);box-shadow:0 0 10px rgba(255,133,151,.45)}body[data-state=paused] .state-dot{background:#ffcf84}.format{font-size:9px;color:var(--muted)}#clock{font-size:35px;font-weight:350;letter-spacing:.025em;line-height:1.25;margin:8px 0 12px;font-variant-numeric:tabular-nums}.transport{display:flex;gap:7px}.transport button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 11px;background:rgba(110,162,255,.09);border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:600}.transport #record{flex:1;background:var(--blue);border-color:transparent;color:#061329}.transport #stop{flex:1;background:rgba(255,133,151,.10);color:#ffb1bd;border-color:rgba(255,133,151,.18)}.record-icon{width:8px;height:8px;border-radius:50%;background:currentColor}.stop-icon{width:8px;height:8px;border-radius:2px;background:currentColor}.transport #pause{width:37px;padding:8px}.transport svg{width:15px;height:15px}.snapshot{display:flex;justify-content:center;align-items:center;gap:7px;width:100%;padding:9px;border:1px dashed rgba(176,204,255,.22);border-radius:9px;background:rgba(110,162,255,.035);color:#b9d1f8;font-size:11px}.snapshot span:last-child{color:var(--muted);font-size:9px;margin-left:auto}.snapshot svg{width:15px}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section-heading h2{font-size:10px;margin:0;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#b2c6e5}.section-heading small{color:var(--muted);font-size:9px}.audio-card{border:1px solid var(--line);border-radius:12px;background:rgba(13,35,67,.45);padding:2px 11px}.channel+.channel{border-top:1px solid var(--line)}.channel{padding:8px 0}.channel button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:0 0 6px;text-align:left}.channel button svg{color:var(--muted);width:16px}.channel button.active svg{color:var(--cyan)}.channel-name{flex:1;font-size:11px}.channel-state{font-size:9px;color:var(--muted)}.toggle{position:relative;display:block;width:25px;height:14px;border-radius:10px;background:#233653;border:1px solid #3a4b65}.toggle:before{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;background:#899bb4;border-radius:50%;transition:transform .15s}.active .toggle{background:rgba(110,162,255,.28);border-color:rgba(110,162,255,.5)}.active .toggle:before{background:#9dc4ff;transform:translateX(11px)}.level{height:3px;margin-left:25px;border-radius:3px;overflow:hidden;background:#1b3050}.level span{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green))}
.camera-card{padding-top:1px}.camera-grid{display:grid;grid-template-columns:1fr 108px;gap:12px}.camera-preview{position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--line);height:99px;background:#020b18}.camera-preview img{display:block;width:100%;height:100%;object-fit:contain}.camera-preview .preview-label{position:absolute;left:7px;bottom:6px;font-size:8px;padding:3px 5px;border-radius:4px;background:rgba(3,13,29,.8);color:#c5d5ed}.camera-preview .no-preview{height:100%;display:grid;place-content:center;color:var(--muted);font-size:10px}.position-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:9px;border:1px solid var(--line);background:rgba(13,35,67,.5);height:99px}.position-grid button{border:1px solid transparent;border-radius:4px;background:rgba(110,162,255,.07);display:grid;place-items:center;padding:0}.position-grid button:before{content:'';width:6px;height:6px;border:1px solid #6684b1;border-radius:2px}.position-grid button[aria-pressed=true]{border-color:var(--blue);background:rgba(110,162,255,.22)}.position-grid button[aria-pressed=true]:before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(110,162,255,.3)}.position-caption{font-size:9px;color:var(--muted);margin:7px 0 9px;display:flex;justify-content:space-between;gap:8px}.position-caption span:last-child{color:#b7d1fa;text-align:right}.size-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}#sizeValue{font-variant-numeric:tabular-nums;color:#c9ddff}input[type=range]{display:block;width:100%;height:16px;margin:6px 0 0;accent-color:var(--blue);cursor:pointer}.camera-toggle{display:flex;align-items:center;gap:6px;font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.03);color:var(--muted)}.camera-toggle.active{color:var(--cyan);border-color:rgba(121,229,245,.23)}.camera-toggle svg{width:13px;height:13px}
footer{padding:0 16px 12px}#status{font-size:10px;line-height:1.45;color:var(--muted);margin:0 0 9px;overflow-wrap:anywhere}.protection{display:flex;align-items:center;justify-content:center;gap:5px;border-top:1px solid var(--line);padding-top:9px;color:#7395a7;font-size:9px}.protection svg{width:11px;height:11px;color:#9bbcad}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#28476d;border-radius:4px}
</style></head>
<body><div class="shell">
<header class="header"><img class="brand-icon" src="assets/lqtac-studio.png" alt=""><div class="brand"><strong>LQTAC <span style="font-weight:400;color:#a4b8d7">Studio</span></strong><small>Capture toolbox</small></div><button id="return" aria-label="Abrir panel de captura en el editor"><svg viewBox="0 0 24 24"><path d="M14 5H5v14h14v-9M13 11l7-7m-6 0h6v6"/></svg>Editor</button></header>
<main>
<section class="timer-panel" aria-label="Grabación"><div class="timer-top"><span class="state"><i class="state-dot"></i><span id="stateName">LISTO</span></span><span class="format">WEBM · LOCAL</span></div><div id="clock" aria-label="Duración grabada">00:00:00</div><div class="transport"><button id="record"><i class="record-icon"></i><span>Grabar</span></button><button id="pause" disabled aria-label="Pausar grabación"><svg id="pauseIcon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button id="stop" disabled><i class="stop-icon"></i>Finalizar</button></div></section>
<button id="snapshot" class="snapshot"><svg viewBox="0 0 24 24"><path d="M4 6h4l2-2h4l2 2h4v14H4z"/><circle cx="12" cy="12" r="4"/></svg><span>Guardar snapshot</span><span>PNG</span></button>
<section aria-labelledby="audioHeading"><div class="section-heading"><h2 id="audioHeading">Entradas de audio</h2><small>Control independiente</small></div><div class="audio-card">
<div class="channel"><button id="microphone" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 10v2a6 6 0 0012 0v-2M12 18v3m-3 0h6"/></svg><span class="channel-name">Micrófono</span><span id="microphoneState" class="channel-state">No incluido</span><span class="toggle"></span></button><div class="level" id="microphoneLevel" role="meter" aria-label="Nivel de micrófono" aria-valuemin="0" aria-valuemax="100"><span></span></div></div>
<div class="channel"><button id="system" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8m-4-4v4m-5-10h2l2-3 2 6 2-3h2"/></svg><span class="channel-name">Sonido del equipo</span><span id="systemState" class="channel-state">No incluido</span><span class="toggle"></span></button><div class="level" id="systemLevel" role="meter" aria-label="Nivel de sonido del equipo" aria-valuemin="0" aria-valuemax="100"><span></span></div></div>
</div></section>
<section id="cameraSection" class="camera-card" aria-labelledby="cameraHeading" hidden><div class="section-heading"><h2 id="cameraHeading">Cámara <small id="cameraMode"></small></h2><button id="camera" class="camera-toggle" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="14" rx="2"/><path d="M15 9l6-3v12l-6-3"/></svg><span id="cameraState">Mostrar</span></button></div>
<div class="camera-grid"><div class="camera-preview"><img id="preview" alt="Vista previa de cámara" hidden><div id="noPreview" class="no-preview">Cámara apagada</div><span class="preview-label">VISTA PREVIA</span></div>
<div id="position" class="position-grid" role="group" aria-label="Posición de cámara">
<button data-position="top-left" aria-label="Arriba izquierda" aria-pressed="false"></button><button data-position="top-center" aria-label="Centro superior" aria-pressed="false"></button><button data-position="top-right" aria-label="Arriba derecha" aria-pressed="false"></button>
<button data-position="center-left" aria-label="Centro izquierda" aria-pressed="false"></button><button data-position="center-center" aria-label="Centro pantalla" aria-pressed="false"></button><button data-position="center-right" aria-label="Centro derecha" aria-pressed="false"></button>
<button data-position="bottom-left" aria-label="Abajo izquierda" aria-pressed="false"></button><button data-position="bottom-center" aria-label="Centro inferior" aria-pressed="false"></button><button data-position="bottom-right" aria-label="Abajo derecha" aria-pressed="true"></button>
</div></div><div class="position-caption"><span id="positionHint">Posición en pantalla</span><span id="positionName">Abajo derecha</span></div><label class="size-label" for="size">Tamaño de cámara <span id="sizeValue">25 %</span></label><input id="size" type="range" min="15" max="40" value="25" aria-label="Tamaño de cámara"></section>
</main><footer><p id="status" role="status">Preparando controles…</p><div class="protection"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></svg>Toolbox excluida de la captura</div></footer></div><script src="capture-toolbox-ui.js"></script></body></html>
